name: Check and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check:
    name: Validate website files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Check required files
        shell: bash
        run: |
          test -f index.html || (echo "Thiếu index.html" && exit 1)
          test -f style.css || (echo "Thiếu style.css" && exit 1)
          test -f script.js || (echo "Thiếu script.js" && exit 1)
          grep -qiE '<title[^>]*>[^<]+</title>' index.html || (echo "index.html phải có thẻ title" && exit 1)
          echo "Kiểm tra thành công: đủ 3 file và index.html có title."

  deploy:
    name: Deploy website
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
